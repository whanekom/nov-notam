name: Flying programme alert

# Reads the evening NHV Ops "Flying Programme" email from Gmail and sends the
# lines for one crew code to WhatsApp. Code and notes: flying_programme/
#
# Checks every 30 minutes between 18:00 and 20:00 UK time.
#
# Two timers start it:
#   1. An outside timer (a Claude scheduled task) starts a run with
#      "timed" switched on at 18:02, 19:02 and 20:02 UK. This is the one
#      to rely on. It cannot run more often than once an hour.
#   2. GitHub's own timer, below, covers the half-hour checks (18:32,
#      19:32) and backs up the others. It often runs late or skips a slot
#      altogether. It only works in UTC, so the times cover both summer
#      (BST) and winter (GMT); the "UK time window" step then drops any
#      run that lands outside 18:00-20:59 UK.
# An email is only ever sent once, whichever timer finds it first.
on:
  schedule:
    - cron: "2,32 17-19 * * *"
    - cron: "2 20 * * *"
  workflow_dispatch:
    inputs:
      timed:
        description: "Started by the outside timer (leave off when running by hand)"
        type: boolean
        default: false
      test:
        description: "Also send a short test message to the phone"
        type: boolean
        default: false

concurrency:
  group: flying-programme
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: flying_programme
    env:
      # Same Gmail login the NOTAM job already uses to send mail.
      GMAIL_USER: ${{ secrets.SMTP_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.SMTP_PASS }}
      # The alert goes by Pushover when its two secrets exist; otherwise by
      # WhatsApp through CallMeBot.
      PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
      PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      CREW_CODE: ${{ vars.CREW_CODE || 'WIHAN' }}
      # Your own lines show your crewmate's code. Set a repository variable
      # SHOW_CREW=false to leave that out.
      SHOW_CREW: ${{ vars.SHOW_CREW }}
      # Handled emails are moved to Gmail's Trash. Set a repository variable
      # KEEP_EMAILS=true to leave them where they are.
      KEEP_EMAILS: ${{ vars.KEEP_EMAILS }}
    steps:
      - uses: actions/checkout@v4

      # Timer-started runs only do anything between 18:00 and 20:59 UK time.
      # A run started by hand always goes ahead.
      - name: UK time window
        id: window
        env:
          EVENT: ${{ github.event_name }}
          TIMED: ${{ inputs.timed }}
        run: |
          echo "::notice::Runner: $(. /etc/os-release && echo "$PRETTY_NAME")"
          hour=$(TZ=Europe/London date +%-H)
          minute=$(TZ=Europe/London date +%-M)
          by_hand=false
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$TIMED" != "true" ]; then
            by_hand=true
          fi
          if [ "$by_hand" = "true" ] || { [ "$hour" -ge 18 ] && [ "$hour" -le 20 ]; }; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "Outside 18:00-20:59 UK time - nothing to do."
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi
          # The 20:00 check is the last proper one of the evening. Only the
          # outside timer's run gives the "no email today" warning, so the
          # backup timer cannot send it a second time.
          if [ "$TIMED" = "true" ] && [ "$hour" -eq 20 ] && [ "$minute" -lt 30 ]; then
            echo "last=true" >> "$GITHUB_OUTPUT"
          else
            echo "last=false" >> "$GITHUB_OUTPUT"
          fi

      # Until the WhatsApp secrets exist, skip quietly instead of failing.
      - name: Check the secrets are set
        id: config
        run: |
          if [ "${{ steps.window.outputs.open }}" != "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$GMAIL_USER" ] || [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "::warning::Not set up yet - the Gmail secrets are missing (see flying_programme/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif { [ -z "$PUSHOVER_APP_TOKEN" ] || [ -z "$PUSHOVER_USER_KEY" ]; } && { [ -z "$WHATSAPP_PHONE" ] || [ -z "$CALLMEBOT_APIKEY" ]; }; then
            echo "::warning::Not set up yet - add the two Pushover secrets or the two WhatsApp secrets (see flying_programme/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            # Say which service will be used and which secrets were found
            # (names only), so a mistyped secret name is easy to spot.
            token=no; [ -n "$PUSHOVER_APP_TOKEN" ] && token=yes
            user=no; [ -n "$PUSHOVER_USER_KEY" ] && user=yes
            via="WhatsApp (CallMeBot)"; [ "$token$user" = "yesyes" ] && via="Pushover"
            echo "::notice::Alert goes by $via. Found PUSHOVER_APP_TOKEN: $token, PUSHOVER_USER_KEY: $user."
          fi

      - uses: actions/setup-python@v5
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Send a test message
        if: steps.config.outputs.ready == 'true' && inputs.test
        run: python alert.py --test

      # Quick look first, so the picture-reading tools are only installed
      # on the runs where there is actually a new email to read.
      - name: Is there a new programme email?
        id: peek
        if: steps.config.outputs.ready == 'true'
        run: python alert.py --peek

      - name: Install picture-reading tools
        if: steps.peek.outputs.new == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          pip install -q -r requirements.txt

      - name: Read the programme and send the alert
        if: steps.peek.outputs.new == 'true'
        run: python alert.py

      - name: Warn if no programme email arrived today
        if: steps.config.outputs.ready == 'true' && steps.window.outputs.last == 'true'
        run: python alert.py --check-missing
