name: MAVIS weather (TAF/METAR)

# Collects TAF and METAR text for every MAVIS station and keeps 24 hours of history.
# The repo is public, so the weather file is never committed or uploaded here;
# a private storage step will be added once the destination is chosen.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mavis-weather
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Collect TAF and METAR
        env:
          MAVIS_USER: ${{ secrets.MAVIS_USER }}
          MAVIS_PASS: ${{ secrets.MAVIS_PASS }}
          NO_EMAIL: "1"
        run: python mavis_weather.py
